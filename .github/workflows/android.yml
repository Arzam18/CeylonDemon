name: Build CeylonDemon Android ARM64

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/android.yml"
      - "Makefile"
      - "src/**"
      - "networks/**"
      - "resonance_simd.h"

permissions:
  contents: read

jobs:
  build-android:
    name: Build ARM64 NEON UCI engine
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Configure Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27c

      - name: Verify and prepare embedded NNUE network
        shell: bash
        run: |
          set -euo pipefail
          NETFILE="networks/ceylondemon-3.1-resonance-v12-400m-full-scratch-e8.aa"

          if [[ ! -s "$NETFILE" ]]; then
            echo "::error::Required NNUE network is missing or empty: $NETFILE"
            echo "Files currently in networks/:"
            find networks -maxdepth 1 -type f -printf '%f (%s bytes)\\n' 2>/dev/null || true
            exit 1
          fi

          echo "Found embedded network:"
          ls -lh "$NETFILE"

          # Clang's integrated assembler may not resolve .incbin through the
          # -Wa,-I flag consistently. resonance_embedded.h uses the basename,
          # so place a copy in the compiler's current working directory.
          cp "$NETFILE" "$(basename "$NETFILE")"
          test -s "$(basename "$NETFILE")"

      - name: Build ARM64 NEON engine
        shell: bash
        run: |
          set -euo pipefail
          TOOLCHAIN="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          export PATH="$TOOLCHAIN:$PATH"

          make clean
          make -j2 ARCH=android-arm64 \
            CXX="$TOOLCHAIN/aarch64-linux-android24-clang++" \
            EXE=dist/CeylonDemon-3.3-android-arm64

          test -s dist/CeylonDemon-3.3-android-arm64
          file dist/CeylonDemon-3.3-android-arm64
          "$TOOLCHAIN/llvm-readelf" -h dist/CeylonDemon-3.3-android-arm64
          "$TOOLCHAIN/llvm-readelf" -d dist/CeylonDemon-3.3-android-arm64 | tee dist/dynamic-section.txt

          # A standalone engine must not require libc++_shared.so at launch.
          if grep -q 'libc++_shared\.so' dist/dynamic-section.txt; then
            echo "::error::Binary still depends on libc++_shared.so; static C++ runtime linking failed."
            exit 1
          fi
          echo "Verified: no libc++_shared.so runtime dependency."

      - name: Package Android build
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          cp dist/CeylonDemon-3.3-android-arm64 release/
          cp LICENSE release/
          cd release
          zip -9 CeylonDemon-3.3-android-arm64.zip CeylonDemon-3.3-android-arm64 LICENSE
          sha256sum CeylonDemon-3.3-android-arm64.zip > SHA256SUMS.txt

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: CeylonDemon-3.3-android-arm64
          path: |
            release/CeylonDemon-3.3-android-arm64.zip
            release/SHA256SUMS.txt
          if-no-files-found: error
